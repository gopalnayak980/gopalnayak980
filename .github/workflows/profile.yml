name: Update profile visuals

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: gopalnayak980
          LEETCODE_USER: Gopal_Nayak
        run: python3 scripts/update_stats.py

      - name: Generate 3D contribution graph
        continue-on-error: true
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: gopalnayak980

      - name: Generate snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gopalnayak980
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit generated files
        run: |
          mkdir -p assets/generated
          cp profile-3d-contrib/profile-night-rainbow.svg assets/generated/profile-3d.svg 2>/dev/null || echo "3D graph not generated, keeping old file"
          cp dist/github-snake-dark.svg assets/generated/snake-dark.svg 2>/dev/null || echo "snake not generated, keeping old file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh profile stats and visuals"
          git push
