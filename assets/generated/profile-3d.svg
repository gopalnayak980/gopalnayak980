<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 140" width="860" height="140" role="img" aria-label="3D Contribution Graph placeholder">
<title>3D Contribution Graph placeholder</title>

<defs>
<linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#00f5ff"/><stop offset=".5" stop-color="#7b2ff7"/><stop offset="1" stop-color="#ff00c8"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1330"/><stop offset="1" stop-color="#070918"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>

<rect width="860" height="140" rx="16" fill="url(#panel)"/><rect x=".75" y=".75" width="858.5" height="138.5" rx="15.5" fill="none" stroke="url(#neon)" stroke-opacity=".7" stroke-width="1.5"/><text x="430" y="66" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" letter-spacing="3" fill="#00f5ff">3D CONTRIBUTION GRAPH</text><text x="430" y="98" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8b9bc0">Generated by the GitHub Action. Run the workflow once (Actions tab, Run workflow).</text>
</svg>
