<text x="290" y="44" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#9b6bff">PROJECT 03</text>
<text x="290" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="900" fill="#fff">JARVIS</text>
<text x="290" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8b9bc0">Bilingual AI voice assistant (Hindi + English)</text>
<text x="290" y="140" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" letter-spacing="2" fill="#00f5ff">PROBLEM SOLVED</text>
<text x="290" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">Most assistants are English-first and forget you</text>
<text x="290" y="183" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">between sessions. JARVIS speaks both and remembers.</text>
<text x="290" y="226" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" letter-spacing="2" fill="#00f5ff">KEY FEATURES</text>
<circle cx="294" cy="243" r="3" fill="#9b6bff"/><text x="306" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">Voice in and out with the Web Speech API</text>
<circle cx="294" cy="265" r="3" fill="#9b6bff"/><text x="306" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">Persistent memory in SQLite across restarts</text>
<circle cx="294" cy="287" r="3" fill="#9b6bff"/><text x="306" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">Gemini Vision + WebRTC motion detection</text>
<rect x="290.0" y="302.0" width="68.8" height="27" rx="13.5" fill="#9b6bff" fill-opacity=".12" stroke="#9b6bff" stroke-opacity=".75"/><text x="324.4" y="320.1" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6f1ff">Python</text>
