<rect x="432.2" y="302.0" width="68.8" height="27" rx="13.5" fill="#9b6bff" fill-opacity=".12" stroke="#9b6bff" stroke-opacity=".75"/><text x="466.7" y="320.1" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6f1ff">Gemini</text>
