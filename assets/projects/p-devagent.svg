<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 356" width="860" height="356" role="img" aria-label="DevAgent: AI software engineering agent platform">
<title>DevAgent: AI software engineering agent platform</title>

<defs>
<linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#00f5ff"/><stop offset=".5" stop-color="#7b2ff7"/><stop offset="1" stop-color="#ff00c8"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1330"/><stop offset="1" stop-color="#070918"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="artclip"><rect x="16" y="16" width="236" height="324" rx="12"/></clipPath>
</defs>
<rect width="860" height="356" rx="16" fill="#05060f"/>
<rect width="860" height="356" rx="16" fill="url(#panel)"/><rect x=".75" y=".75" width="858.5" height="354.5" rx="15.5" fill="none" stroke="#00f5ff" stroke-opacity=".8" stroke-width="1.5"/>
<g fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity=".8" stroke-linecap="round"><path d="M10 26V10H26"/><path d="M834 10H850V26"/><path d="M10 330V346H26"/><path d="M834 346H850V330"/></g>
<rect x="16" y="16" width="236" height="324" rx="12" fill="#00f5ff" fill-opacity=".05" stroke="#00f5ff" stroke-opacity=".35"/>
<g clip-path="url(#artclip)"><g transform="translate(0 14)"><g transform="translate(125 150)">
<g stroke="#00f5ff" stroke-opacity=".5" fill="none"><path d="M0 0L-80 -62M0 0L82 -62M0 0L0 84" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.6s" repeatCount="indefinite"/></path></g>
<circle r="30" fill="#0a0d24" stroke="#00f5ff" stroke-width="2" filter="url(#soft)"/><text y="5" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#00f5ff">SUPER</text>
<circle r="46" fill="none" stroke="#00f5ff" stroke-opacity=".35"><animate attributeName="r" values="36;60;36" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".6;0;.6" dur="3s" repeatCount="indefinite"/></circle>
<g><circle cx="-80" cy="-62" r="22" fill="#0a0d24" stroke="#ff00c8" stroke-width="1.6"/><text x="-80" y="-58" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#ff00c8">CODE</text></g>
<g><circle cx="82" cy="-62" r="22" fill="#0a0d24" stroke="#22d3a5" stroke-width="1.6"/><text x="82" y="-58" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" fill="#22d3a5">DEBUG</text></g>
<g><circle cx="0" cy="84" r="22" fill="#0a0d24" stroke="#ffd43b" stroke-width="1.6"/><text x="0" y="88" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#ffd43b">STUDY</text></g>
<circle r="3.5" fill="#fff"><animateMotion dur="2.4s" repeatCount="indefinite" path="M0 0L-80 -62"/></circle>
<circle r="3.5" fill="#fff"><animateMotion dur="2.4s" begin="-.8s" repeatCount="indefinite" path="M0 0L82 -62"/></circle>
<circle r="3.5" fill="#fff"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" path="M0 0L0 84"/></circle></g>
<g transform="translate(34 262)"><rect width="182" height="30" rx="15" fill="#22d3a5" fill-opacity=".15" stroke="#22d3a5"/><text x="91" y="20" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#22d3a5">HUMAN APPROVAL ✓</text></g></g></g>
<text x="290" y="44" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="3" fill="#00f5ff">PROJECT 01</text>
<text x="290" y="82" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="900" fill="#fff">DevAgent</text>
<text x="290" y="108" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8b9bc0">AI software engineering agent platform</text>
<text x="290" y="140" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" letter-spacing="2" fill="#00f5ff">PROBLEM SOLVED</text>
<text x="290" y="162" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">AI assistants can change code with no human check.</text>
<text x="290" y="183" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">Agents here only propose diffs; a human approves them.</text>
<text x="290" y="226" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" letter-spacing="2" fill="#00f5ff">KEY FEATURES</text>
<circle cx="294" cy="243" r="3" fill="#00f5ff"/><text x="306" y="248" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">Supervisor routes work to Coding, Debug, Study agents</text>
<circle cx="294" cy="265" r="3" fill="#00f5ff"/><text x="306" y="270" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">Diff review, SHA-256 stale-file guard, atomic writes</text>
<circle cx="294" cy="287" r="3" fill="#00f5ff"/><text x="306" y="292" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" fill="#e6f1ff">JWT + RBAC, Celery/Redis jobs, 307 backend tests</text>
<rect x="290.0" y="302.0" width="61.4" height="27" rx="13.5" fill="#00f5ff" fill-opacity=".12" stroke="#00f5ff" stroke-opacity=".75"/><text x="320.7" y="320.1" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6f1ff">React</text>
<rect x="357.4" y="302.0" width="76.3" height="27" rx="13.5" fill="#00f5ff" fill-opacity=".12" stroke="#00f5ff" stroke-opacity=".75"/><text x="395.5" y="320.1" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6f1ff">FastAPI</text>
<rect x="439.7" y="302.0" width="53.9" height="27" rx="13.5" fill="#00f5ff" fill-opacity=".12" stroke="#00f5ff" stroke-opacity=".75"/><text x="466.6" y="320.1" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6f1ff">Groq</text>
<rect x="499.6" y="302.0" width="98.8" height="27" rx="13.5" fill="#00f5ff" fill-opacity=".12" stroke="#00f5ff" stroke-opacity=".75"/><text x="549.0" y="320.1" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6f1ff">PostgreSQL</text>
<rect x="604.3" y="302.0" width="61.4" height="27" rx="13.5" fill="#00f5ff" fill-opacity=".12" stroke="#00f5ff" stroke-opacity=".75"/><text x="635.0" y="320.1" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6f1ff">Redis</text>
<rect x="671.7" y="302.0" width="68.8" height="27" rx="13.5" fill="#00f5ff" fill-opacity=".12" stroke="#00f5ff" stroke-opacity=".75"/><text x="706.1" y="320.1" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#e6f1ff">Celery</text>
</svg>
