<text x="28" y="24" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" letter-spacing="2.5" fill="#00f5ff">// 01 · TELEMETRY</text>
<text x="28" y="60" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="1.5" fill="url(#t)">AI DEVELOPER COMMAND CENTER</text>
